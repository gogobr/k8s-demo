apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq
  namespace: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq
  template:
    metadata:
      labels:
        app: rocketmq
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:5.2.0
          command: [ "sh", "mqnamesrv" ]
          ports:
            - containerPort: 9876
          env:
            - name: JAVA_OPT_EXT
              value: "-server -Xms256m -Xmx256m -Xmn128m"

        - name: broker
          image: apache/rocketmq:5.2.0
          command:
            - sh
            - -c
            # 💡 核心修正：向 NameServer 注册时，不仅指定 Mac 的 IP，还要带上外部暴露的 NodePort 端口 (30911)
            - "echo 'autoCreateTopicEnable=true' > /tmp/broker.conf && echo 'brokerIP1=10.1.11.23' >> /tmp/broker.conf && echo 'listenPort=30911' >> /tmp/broker.conf && sh mqbroker -n localhost:9876 -c /tmp/broker.conf --enable-proxy"
          env:
            - name: JAVA_OPT_EXT
              value: "-server -Xms512m -Xmx512m -Xmn256m"
          ports:
            - containerPort: 30911 # 容器内也改为监听 30911，保持一致
            - containerPort: 10909
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-svc
  namespace: middleware
spec:
  type: NodePort
  ports:
    - port: 9876
      targetPort: 9876
      nodePort: 30876
      name: namesrv
    - port: 8081
      targetPort: 8081
      nodePort: 30081
      name: grpc
    - port: 30911 # 👈 统一改为 30911
      targetPort: 30911
      nodePort: 30911
      name: broker
  selector:
    app: rocketmq